spring:
  application:
    name: myapp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/myappdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:8013472486}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

jwt:
  access-token-expiration-minutes: 15
  cookie:
    secure: false
  refresh-token-expiration-days: 7
  
rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

